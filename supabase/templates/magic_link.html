<div style="font-family:ui-rounded,'SF Pro Rounded','Nunito',Arial,sans-serif;background:#FFF7EA;padding:28px;color:#4A3527;border-radius:20px;max-width:440px;margin:0 auto">
  <h2 style="margin:0 0 6px;font-size:24px">duo <span style="color:#E8846B">💛</span></h2>
  <p style="font-size:15px;line-height:1.5;margin:0 0 18px">Here's your way in — no password, ever.</p>
  <p style="margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6B5240">Your 6-digit code</p>
  <p style="font-size:34px;font-weight:800;letter-spacing:.18em;margin:0 0 18px;font-variant-numeric:tabular-nums">{{ .Token }}</p>
  <p style="font-size:14px;line-height:1.5;margin:0 0 14px">Type it into Duo — that's the easiest way if you've added Duo to your home screen.</p>
  <p style="margin:0 0 18px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E8846B;color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:14px">Or tap to sign in →</a></p>
  <p style="font-size:12px;color:#6B5240;margin:0">The code works for an hour. If you didn't ask for this, you can ignore it.</p>
</div>
